name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows a deploy to be triggered by hand from the Actions tab.
  workflow_dispatch:

# The token needs to be able to publish a Pages artifact.
permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it, but queue at most
# one more behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Plain HTML + CSS + JS: nothing to build, publish the repo as-is.
      # The action already excludes .git and .github from the artifact.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
